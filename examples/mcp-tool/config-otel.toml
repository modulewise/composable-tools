[component.multiply]
uri = "../../components/lib/mcp-tool.wasm"
imports = ["mcp-client"]
config.server-url = "http://localhost:3001/mcp"
config.tool-name = "multiply"

[component.mcp-client]
uri = "../../components/lib/mcp-client-otel-interceptor.wasm"
imports = ["mcp-client-target", "otel", "clocks", "random"]

[component.mcp-client-target]
uri = "../../components/lib/mcp-client.wasm"
imports = ["http-client", "logger"]

[component.http-client]
uri = "oci://ghcr.io/componentized/http/client:0.1.0"
imports = ["http"]

[component.logger]
uri = "oci://ghcr.io/componentized/logging/to-stderr:0.3.1"
imports = ["cli", "clocks"]

[capability.http]
type = "wasi:http"

[capability.clocks]
type = "wasi:clocks"

[capability.random]
type = "wasi:random"

[capability.cli]
type = "wasi:cli"
inherit-stderr = true

[capability.otel]
type = "otel"
endpoint = "http://localhost:4317"
protocol = "grpc"

[capability.otel.resource]
"service.name" = "mcp-tool-example"
